    root: ruby-dev:31320
  - id: stdlib-criteria
    request: >-
      What criteria were discussed for adopting libraries into the standard library for Ruby 1.9? Point me to the
      original discussion.
    root: ruby-dev:31227
  - id: net-https
    request: net/https の中身が net/http に統合されたときの経緯と、そのときの判断を元の議論つきで教えてください。
    root: ruby-dev:39995
    issue: 2574
  - id: thread-exclusive
    request: Why was Thread.exclusive deprecated? Show me where it was discussed.
    root: ruby-core:78341
    issue: 11904
